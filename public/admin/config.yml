# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json
backend:
  name: github
  repo: hoagminh/saasbase-landing
  branch: main
  auth_endpoint: /api/auth
  commit_messages:
    openAuthoring: '{{message}} (by {{author-login}})'

app_title: SaasBase Admin
publish_mode: editorial_workflow
media_folder: public/uploads
public_folder: /uploads
logo:
  src: /app-icon.png
  show_in_header: true

i18n:
  structure: multiple_folders
  locales: [en, vi]
  default_locale: en

slug:
  encoding: unicode
  clean_accents: true
  sanitize_replacement: "-"
  trim: true
  lowercase: true
  timezone: utc

collections:
  - name: "authors"
    label: "Authors"
    icon: "person"
    label_singular: "Author"
    description: "Authors collections"
    folder: "contents/authors"
    slug: "{{slug}}"
    create: true
    extension: yaml
    format: yaml
    editor:
      preview: false
    fields:
      - { label: "Name", name: "name", widget: "string"}
      - { label: "Avatar", name: "avatar", widget: "image", required: false }
      - { label: "Bio", name: "bio", widget: "text", required: false }
      - { label: "Email", name: "email", widget: "string", required: false }
      - { label: "Website", name: "website", widget: "string", required: false }
      - { label: "Twitter", name: "twitter", widget: "string", required: false }
      - { label: "GitHub", name: "github", widget: "string", required: false }

  - name: "legal"
    label: "Legal Documents"
    icon: "policy"
    label_singular: "Legal Document"
    description: "Legal policies and terms"
    folder: "contents/legal"
    slug: "{{slug}}"
    create: true
    extension: md
    format: frontmatter
    i18n: true
    editor:
      preview: false
    fields:
      - { label: "Title", name: "title", widget: "string", i18n: true }
      - { label: "Description", name: "description", widget: "text", required: false, i18n: true }
      - { label: "Last Updated", name: "lastUpdated", widget: "datetime", format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false, default: "{{now}}", required: false, i18n: duplicate }
      - { label: "Body", name: "body", widget: "markdown", i18n: true }

  - name: "settings"
    label: "Site Settings"
    icon: "settings"
    i18n:
      structure: single_file
    editor:
      preview: false
    files:
      - label: "Global SEO"
        name: "global_seo"
        i18n: true
        file: "contents/settings/seo.yaml"
        fields:
          - { label: "Site Name", name: "site_name", widget: "string", i18n: true }
          - { label: "Default Meta Title", name: "title", widget: "string", i18n: true }
          - { label: "Default Meta Description", name: "description", widget: "text", i18n: true }
          - { label: "Default Keywords", name: "keywords", widget: "text", i18n: true }
          - { label: "Default Image", name: "image", widget: "image", required: false, i18n: duplicate }
          - { label: "Author", name: "author", widget: "string", required: false, i18n: true }
          - { label: "Twitter Handle", name: "twitter_handle", widget: "string", required: false, i18n: true }
          - { label: "Theme Color", name: "theme_color", widget: "string", required: false, i18n: duplicate }
          - { label: "URL", name: "url", widget: "string", required: false, i18n: duplicate }

  - name: "landing"
    label: "Landing Page"
    icon: "web"
    i18n:
      structure: single_file
    editor:
      preview: false
    files:
      - label: "Landing Content"
        name: "landing_content"
        i18n: true
        file: "contents/landing/content.yaml"
        fields:
          - label: "Tech Partners"
            name: "techPartners"
            widget: "list"
            i18n: duplicate
            summary: "{{fields.name}}"
            fields:
              - { label: "ID", name: "id", widget: "string" }
              - { label: "Partner Name", name: "name", widget: "string" }
              - { label: "Logo URL", name: "logoUrl", widget: "image" }

          - label: "Workflow Steps"
            name: "workflowSteps"
            widget: "list"
            i18n: duplicate
            summary: "Step {{fields.step}}: {{fields.title}}"
            fields:
              - { label: "Step Number", name: "step", widget: "number", value_type: "int", i18n: duplicate }
              - { label: "Badge Key (e.g. 01)", name: "badgeKey", widget: "string", i18n: duplicate }
              - { label: "Title", name: "title", widget: "string", i18n: true }
              - { label: "Description", name: "desc", widget: "text", i18n: true }
              - { label: "Image URL", name: "imageUrl", widget: "image", i18n: duplicate }

          - label: "Features (Benefits)"
            name: "benefitItems"
            widget: "list"
            i18n: true
            summary: "{{fields.title}}"
            fields:
              - { label: "ID", name: "id", widget: "string", i18n: duplicate }
              - label: "Icon Name"
                name: "iconName"
                widget: "select"
                i18n: duplicate
                options:
                  - { label: "Server", value: "server" }
                  - { label: "Database", value: "database" }
                  - { label: "Refresh (Sync)", value: "refresh-cw" }
                  - { label: "Shield Check (Security)", value: "shield-check" }
                  - { label: "Zap (Fast)", value: "zap" }
                  - { label: "Grid (Apps)", value: "grid-2x2" }
                  - { label: "Boxes", value: "boxes" }
              - { label: "Title", name: "title", widget: "string", i18n: true }
              - { label: "Description", name: "desc", widget: "text", i18n: true }
              - { label: "Action Text", name: "action", widget: "string", i18n: true }
              - label: "Tags"
                name: "tags"
                widget: "list"
                required: false
                i18n: duplicate
                field: { label: "Tag", name: "tag", widget: "string" }

          - label: "Testimonials"
            name: "testimonials"
            widget: "list"
            i18n: true
            summary: "{{fields.name}} ({{fields.role}})"
            fields:
              - { label: "ID", name: "id", widget: "string", i18n: duplicate }
              - { label: "Author Name", name: "name", widget: "string", i18n: duplicate }
              - { label: "Role", name: "role", widget: "string", i18n: true }
              - { label: "Quote", name: "quote", widget: "text", i18n: true }
              - { label: "Avatar Image", name: "avatarUrl", widget: "image", i18n: duplicate }

          - label: "FAQ Items"
            name: "faqItems"
            widget: "list"
            i18n: true
            summary: "{{fields.question}}"
            fields:
              - { label: "ID", name: "id", widget: "string", i18n: duplicate }
              - { label: "Question", name: "question", widget: "string", i18n: true }
              - { label: "Answer", name: "answer", widget: "text", i18n: true }
