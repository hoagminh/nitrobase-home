<!DOCTYPE html>
<html lang="en" data-theme="light" data-auto-theming="false">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <title>Admin</title>
  </head>
  <body>
    <script>
      window.CMS_MANUAL_INIT = true;
    </script>
    <script src="https://unpkg.com/@sveltia/cms/dist/sveltia-cms.js"></script>
    <script>
      CMS.init({
        load_config_file: true,
      });

    
      CMS.registerEditorComponent({
        id: 'youtube',
        label: 'YouTube',
        icon: 'youtube_activity',
        fields: [
          { name: 'id', label: 'ID' },
          { name: 'width', label: 'Width', widget: 'number', value_type: 'int', default: 560 },
          { name: 'height', label: 'Height', widget: 'number', value_type: 'int', default: 315 },
        ],
        pattern: /{{< youtube id="(?<id>.*?)"(?: width="(?<width>.*?)" height="(?<height>.*?)")? >}}/m,
        fromBlock: ({ groups: { id, width, height } = {} }) => ({
          id,
          width: width ? Number(width) : 560,
          height: height ? Number(height) : 315,
        }),
        toBlock: ({ id, width = 560, height = 315 }) =>
          `{{< youtube id="${id}" width="${width}" height="${height}" >}}`,
        toPreview: ({ id, width = 560, height = 315 }) =>
          id
            ? `<iframe src="https://www.youtube-nocookie.com/embed/${id}"
                width="${width}" height="${height}" allowfullscreen
                allow="autoplay; encrypted-media; picture-in-picture"></iframe>`
            : '',
      });

      CMS.registerEditorComponent({
        id: 'code',
        label: 'Code Block',
        icon: 'code',
        fields: [
          {
            name: 'language',
            label: 'Language',
            widget: 'select',
            options: [
              'javascript',
              'typescript',
              'python',
              'php',
              'java',
              'csharp',
              'cpp',
              'c',
              'ruby',
              'go',
              'rust',
              'swift',
              'kotlin',
              'html',
              'css',
              'scss',
              'sql',
              'bash',
              'shell',
              'yaml',
              'json',
              'xml',
              'markdown',
            ],
            default: 'javascript',
          },
          {
            name: 'code',
            label: 'Code',
            widget: 'text',
          },
        ],
        pattern: /```(?<language>\w+)?\n(?<code>[\s\S]*?)\n```/m,
        fromBlock: ({ groups: { language = 'javascript', code = '' } = {} }) => ({
          language,
          code: code.trim(),
        }),
        toBlock: ({ language = 'javascript', code = '' }) =>
          `\`\`\`${language}\n${code}\n\`\`\``,
        toPreview: ({ language = 'javascript', code = '' }) =>
          code
            ? `<pre><code class="language-${language}">${code
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')}</code></pre>`
            : '',
      });

      CMS.registerEditorComponent({
        id: 'callout',
        label: 'Callout / Admonition',
        icon: 'announcement',
        fields: [
          {
            name: 'type',
            label: 'Callout Type',
            widget: 'select',
            options: [
              { label: 'Note (Blue)', value: 'note' },
              { label: 'Tip (Green)', value: 'tip' },
              { label: 'Info (Cyan)', value: 'info' },
              { label: 'Warning (Amber)', value: 'warning' },
              { label: 'Caution (Orange)', value: 'caution' },
              { label: 'Danger (Red)', value: 'danger' },
            ],
            default: 'note',
          },
          {
            name: 'title',
            label: 'Title',
            widget: 'string',
            required: false,
          },
          {
            name: 'body',
            label: 'Content',
            widget: 'text',
          },
        ],
        pattern: /^:::(note|tip|info|warning|caution|danger)(?:\[(.*?)\])?\n([\s\S]*?)\n:::/m,
        fromBlock: (match) => ({
          type: match[1] || 'note',
          title: match[2] || '',
          body: match[3] || '',
        }),
        toBlock: ({ type = 'note', title = '', body = '' }) =>
          title ? `:::${type}[${title}]\n${body}\n:::` : `:::${type}\n${body}\n:::`,
        toPreview: ({ type = 'note', title = '', body = '' }) =>
          `<div style="border-left: 4px solid #339af0; padding: 10px 14px; margin: 10px 0; background: #f8f9fa; border-radius: 4px;">
            <div style="font-weight: 700; margin-bottom: 6px; text-transform: uppercase; font-size: 11px; color: #1971c2;">${type}: ${title || ''}</div>
            <div style="font-size: 13px; line-height: 1.5;">${body}</div>
          </div>`,
      });
    </script>
  </body>
</html>
