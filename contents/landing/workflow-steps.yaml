en:
  workflowSteps:
    - step: 1
      badgeKey: "01"
      title: Connect VPS & Guided Bootstrap
      desc: Connect any Ubuntu or Debian VPS over SSH with TOFU host key verification,
        or use Localhost. Nitrobase previews every change before provisioning
        Docker CE, Traefik v3, automatic Let's Encrypt HTTPS, or Cloudflare
        Tunnel.
      imageUrl: /uploads/step-1.png
    - step: 2
      badgeKey: "02"
      title: Deploy Backends, DBs & Git Apps
      desc: Launch Supabase (with ES256 keys & Studio), Appwrite, PocketBase,
        standalone databases (Postgres, MySQL, MariaDB, Valkey, MongoDB), n8n,
        or your own Git repo (Dockerfile, Railpack, Static), or import from
        Supabase & Appwrite Cloud.
      imageUrl: /uploads/step-2.png
    - step: 3
      badgeKey: "03"
      title: Backups, Moves & AI Automation
      desc: Schedule consistent .tar.zst app backups and OpenSSL self-backups via
        rclone to S3, Cloudflare R2, or Backblaze B2. Move apps between servers
        with health checks and automatic rollback, or operate via REST & MCP.
      imageUrl: /uploads/step-3.png
vi:
  workflowSteps:
    - step: 1
      badgeKey: "01"
      title: Kết nối VPS & Khởi tạo có xem trước
      desc: Kết nối bất kỳ VPS Ubuntu hoặc Debian nào qua SSH có xác minh TOFU, hoặc
        dùng ngay Localhost. Nitrobase hiển thị trước mọi thay đổi rồi cài đặt
        Docker CE, Traefik v3, HTTPS Let's Encrypt tự động hoặc Cloudflare
        Tunnel.
      imageUrl: /uploads/step-1.png
    - step: 2
      badgeKey: "02"
      title: Triển khai Backend, DB & Git App
      desc: Khởi chạy Supabase (kèm khóa ES256 & Studio), Appwrite, PocketBase, cơ sở
        dữ liệu độc lập (Postgres, MySQL, MariaDB, Valkey, MongoDB), n8n hoặc
        kho Git (Dockerfile, Railpack, Static), hay nhập từ Supabase & Appwrite
        Cloud.
      imageUrl: /uploads/step-2.png
    - step: 3
      badgeKey: "03"
      title: Sao lưu, Di chuyển & Tự động hóa AI
      desc: Lập lịch sao lưu .tar.zst nhất quán và tự sao lưu OpenSSL qua rclone lên
        S3, Cloudflare R2 hoặc Backblaze B2. Di chuyển app giữa các máy chủ có
        kiểm tra sức khỏe, rollback tự động và vận hành qua REST & MCP.
      imageUrl: /uploads/step-3.png
