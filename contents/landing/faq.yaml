en:
  faqItems:
    - id: faq-1
      question: What is Nitrobase and how is it licensed?
      answer: Nitrobase is a fair-source (FSL-1.1-ALv2, converting automatically to
        Apache 2.0 two years after each release), self-hosted PaaS and BaaS
        control panel. You can use, modify, and self-host it freely for personal,
        company, or client projects. It ships first-class templates for Supabase,
        Appwrite, PocketBase, standalone databases (PostgreSQL, MySQL, MariaDB,
        Valkey, MongoDB), n8n, Plausible, Umami, and RustFS, alongside Git
        deployments (Dockerfile, Railpack, Static), Custom Compose, REST API, and
        an MCP server for AI agents.
    - id: faq-2
      question: What operating systems, VPS providers, and specs are required?
      answer: The VPS install script and guided server bootstrap support Ubuntu and
        Debian (amd64 or arm64) from any provider (Hetzner, DigitalOcean, Vultr,
        Linode, AWS, GCP, OVH, bare-metal, etc.), and the official Docker
        installer image (ghcr.io/aydengroup/nitrobase-installer:beta) runs on any
        OS with Docker. The panel and its Postgres use ~300 MB RAM and 1 GB disk;
        we recommend at least 2 GB RAM and 5 GB free disk (a full Supabase stack
        uses 1–1.5 GB RAM; add a 2 GB swap file on small VPS nodes).
    - id: faq-3
      question: What is included in the self-hosted Supabase template?
      answer: Nitrobase deploys tested monthly supabase/supabase releases (v1.YY.MM)
        with PostgreSQL + pgvector, Supavisor pooler, Kong Gateway, GoTrue Auth,
        PostgREST, Realtime, Storage, Edge Functions, and Studio. Every demo
        secret is replaced with generated credentials—including asymmetric ES256
        API keys on v1.26.04+—and the built-in Supabase plugin adds Edge Function
        management, encrypted function secrets, an audited SQL runner, and
        storage metadata repair.
    - id: faq-4
      question: How does Cloud Sync work with Supabase Cloud and Appwrite Cloud?
      answer: Nitrobase supports one-off import (cloud to self-hosted) and export
        (self-hosted to an empty cloud project) for both Supabase Cloud and
        Appwrite Cloud. For Supabase, it connects over TLS verify-full to copy
        your database, storage files via rclone, edge functions, and pg_cron jobs
        (paused by default so old URLs are not called). For Appwrite, it preserves
        your Project ID and copies users, teams, databases, storage, function
        settings, and platforms.
    - id: faq-5
      question: How does Nitrobase secure secrets, Compose files, and backups?
      answer: All stored secrets (SSH keys, app env vars, database passwords,
        destination keys) are encrypted at rest using authenticated AES-256-GCM
        with HKDF-SHA256 (Format v3) and support atomic ENCRYPTION_KEY rotation
        with ENCRYPTION_KEY_PREVIOUS fallback. Every Compose file passes strict
        security checks (no host escapes, privileged containers, or reserved
        labels/networks). App backups (.tar.zst with encrypted env.enc) and
        OpenSSL AES-256-CBC self-backups upload via rclone to S3, R2, B2, or a
        local folder, protected by a one-time SETUP_TOKEN, 2FA, RBAC, and
        Split-Brain Guard.
    - id: faq-6
      question: Can I publish apps without opening ports 80 and 443?
      answer: Yes. Nitrobase natively supports Cloudflare Tunnel using only the
        tunnel connector token—never calling the Cloudflare API. Tunnel traffic
        is isolated on a private Docker network (nitrobase-tunnel,
        172.31.254.0/29) routed to Traefik's private entrypoint
        (http://nitrobase-traefik:8081). With Tunnel-Only mode enabled, ports 80
        and 443 can stay completely blocked on your VPS firewall.
    - id: faq-7
      question: How does moving an app between servers work?
      answer: Under App → Settings → Move to another server, Nitrobase takes a
        consistent backup on the source server, restores the app with the same
        app ID, data, and environment on the target server, waits for full health
        and stability verification, and only then removes the old copy. Free
        *.sslip.io domains follow automatically (custom domains list the exact
        DNS records to update), and any failure deletes the target copy and
        restarts the original app untouched.
    - id: faq-8
      question: Can AI coding agents like Claude Code or Cursor manage Nitrobase?
      answer: >-
        Yes. Nitrobase exposes a stateless Streamable HTTP MCP server at
        /api/mcp authenticated with scoped nbk_... bearer tokens. Every
        non-streaming /api/v1 operation is automatically exposed as an MCP tool
        with read-only/destructive safety hints, dedicated AI agent (read-only)
        and AI agent (operator) token presets, copyable Claude Code & Cursor
        snippets in Settings → API tokens, rate limiting, and full audit logging
        tagged channel: mcp.
vi:
  faqItems:
    - id: faq-1
      question: Nitrobase là gì và sử dụng giấy phép nào?
      answer: Nitrobase là bảng điều khiển PaaS & BaaS tự lưu trữ theo mô hình fair
        source (FSL-1.1-ALv2, tự động chuyển sang Apache 2.0 sau 2 năm kể từ mỗi
        bản phát hành). Bạn được tự do sử dụng, chỉnh sửa và tự lưu trữ cho dự án
        cá nhân, công ty hoặc khách hàng. Hệ thống tích hợp sẵn template cho
        Supabase, Appwrite, PocketBase, cơ sở dữ liệu độc lập (PostgreSQL, MySQL,
        MariaDB, Valkey, MongoDB), n8n, Plausible, Umami và RustFS, cùng triển
        khai Git (Dockerfile, Railpack, Static), Custom Compose, REST API và máy
        chủ MCP cho AI agent.
    - id: faq-2
      question: Yêu cầu hệ điều hành, nhà cung cấp VPS và cấu hình phần cứng là gì?
      answer: Script cài đặt VPS và trình khởi tạo hỗ trợ Ubuntu và Debian (amd64 hoặc
        arm64) trên mọi nhà cung cấp (Hetzner, DigitalOcean, Vultr, Linode, AWS,
        GCP, OVH, máy chủ vật lý...), còn Docker installer image chính thức
        (ghcr.io/aydengroup/nitrobase-installer:beta) chạy trên mọi hệ điều hành
        có Docker. Bản thân panel và Postgres chỉ dùng ~300 MB RAM và 1 GB đĩa;
        khuyến nghị tối thiểu 2 GB RAM và 5 GB đĩa trống (một cụm Supabase đầy đủ
        dùng 1–1,5 GB RAM; nên thêm 2 GB swap trên VPS nhỏ).
    - id: faq-3
      question: Template Supabase tự lưu trữ bao gồm những gì?
      answer: Nitrobase triển khai các bản phát hành hàng tháng đã kiểm thử của
        supabase/supabase (v1.YY.MM) gồm PostgreSQL + pgvector, Supavisor, Kong
        Gateway, GoTrue Auth, PostgREST, Realtime, Storage, Edge Functions và
        Studio. Mọi khóa mẫu đều được thay bằng bí mật tự sinh — gồm cả khóa bất
        đối xứng ES256 từ v1.26.04+ — và plugin Supabase tích hợp cho phép quản lý
        Edge Functions, bí mật function mã hóa, chạy SQL có kiểm toán và sửa siêu
        dữ liệu Storage.
    - id: faq-4
      question: Tính năng Cloud Sync với Supabase Cloud và Appwrite Cloud hoạt động ra sao?
      answer: Nitrobase hỗ trợ nhập (từ cloud về self-hosted) và xuất (từ self-hosted
        lên dự án cloud trống) cho cả Supabase Cloud lẫn Appwrite Cloud. Với
        Supabase, hệ thống kết nối qua TLS verify-full để sao chép cơ sở dữ liệu,
        tệp Storage bằng rclone, Edge Functions và tác vụ pg_cron (mặc định tạm
        dừng để tránh gọi nhầm địa chỉ cũ). Với Appwrite, hệ thống giữ nguyên
        Project ID và sao chép người dùng, đội ngũ, database, storage, cấu hình
        function và platforms.
    - id: faq-5
      question: Nitrobase bảo vệ bí mật, file Compose và bản sao lưu như thế nào?
      answer: Mọi bí mật lưu trữ (khóa SSH, biến môi trường, mật khẩu DB, khóa kho sao
        lưu) đều được mã hóa xác thực AES-256-GCM với HKDF-SHA256 (Format v3) và
        hỗ trợ xoay khóa ENCRYPTION_KEY kèm dự phòng ENCRYPTION_KEY_PREVIOUS. Mọi
        file Compose đều đi qua chính sách bảo mật nghiêm ngặt (chặn thoát thư
        mục, container privileged và nhãn/mạng dành riêng). Bản sao lưu app
        (.tar.zst chứa env.enc mã hóa) và tự sao lưu OpenSSL AES-256-CBC tải qua
        rclone lên S3, R2, B2 hoặc thư mục máy chủ, bảo vệ bởi SETUP_TOKEN dùng
        một lần, 2FA, RBAC và cơ chế chống Split-Brain.
    - id: faq-6
      question: Tôi có thể xuất bản ứng dụng mà không cần mở cổng 80 và 443 không?
      answer: Có. Nitrobase tích hợp sẵn Cloudflare Tunnel chỉ cần token kết nối —
        không bao giờ gọi API Cloudflare. Lưu lượng tunnel được cô lập trên mạng
        Docker riêng (nitrobase-tunnel, 172.31.254.0/29) trỏ tới cổng riêng của
        Traefik (http://nitrobase-traefik:8081). Khi bật chế độ Tunnel-Only, bạn
        có thể khóa hoàn toàn cổng 80 và 443 trên tường lửa VPS.
    - id: faq-7
      question: Quy trình di chuyển ứng dụng giữa các máy chủ diễn ra như thế nào?
      answer: Tại App → Settings → Move to another server, Nitrobase tạo bản sao lưu
        nhất quán trên máy chủ nguồn, khôi phục lên máy chủ đích với cùng App ID,
        dữ liệu và biến môi trường, chờ kiểm tra sức khỏe và độ ổn định hoàn tất
        rồi mới gỡ bản cũ. Tên miền miễn phí *.sslip.io tự cập nhật theo máy mới
        (tên miền riêng hiển thị chính xác bản ghi DNS cần đổi), và nếu có lỗi,
        hệ thống xóa bản đích và khởi động lại app gốc nguyên vẹn.
    - id: faq-8
      question: Các AI coding agent như Claude Code hay Cursor có thể điều khiển Nitrobase không?
      answer: >-
        Có. Nitrobase tích hợp sẵn máy chủ MCP Streamable HTTP stateless tại
        /api/mcp xác thực bằng Bearer token nbk_... phân quyền. Mọi endpoint
        /api/v1 (trừ stream SSE) đều tự động thành công cụ MCP có nhãn an toàn
        read-only/destructive, kèm preset AI agent (read-only) và AI agent
        (operator), đoạn cấu hình sao chép nhanh cho Claude Code & Cursor trong
        Settings → API tokens, rate limit và nhật ký kiểm toán gắn nhãn
        channel: mcp.
